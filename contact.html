            <h3>Contact Us</h3>
            <form>
              <div class="row">
                <div class="col-md-6">
                  <label for="labelforname" class="form-label mb-3">Enter name</label>
                  <input type="text" class="form-control" id="labelfornamr">
                  <label for="labelforname" class="form-label">Enter Email</label>

                </div>

                <div class="col-md-6">
                  <label for="labelforname" class="form-label mb-3">Enter Alternative Mob No</label>
                  <input type="text" class="form-control" id="labelfornamr">
                  <label for="labelforname" class="form-label">Enter Mobile No</label>
                  <input type="email" class="form-control mb-3" id="labelfornamr">
                </div>
                <div class="col-md-4">
                  <label for="labelforname" class="form-label">select country</label>
                  <select class="form-select" aria-label="Default select example">
                    <option selected>choose country</option>
                    <option value="1">India</option>
                    <option value="2">UK</option>
                    <option value="3">USA</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="labelforname" class="form-label">select state</label>
                  <select class="form-select" aria-label="Default select example">
                    <option selected>choose state</option>
                    <option value="1">MAHARASHTRA</option>
                    <option value="2">GOA</option>
                    <option value="3">BIHAR</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="labelforname" class="form-label">select city</label>
                  <select class="form-select" aria-label="Default select example">
                    <option selected>choose city</option>
                    <option value="1">Nashik</option>
                    <option value="2">Mumbai</option>
                    <option value="3">pune</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                    <label class="form-check-label" for="radioDefault1">
                      Male
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                    <label class="form-check-label" for="radioDefault2">
                      Female
                    </label>
                  </div>
                </div>
                <div class="col-md-4">
                  <label for="labelforname" class="form-label">DOB</label>
                  <input type="date" class="form-control mb-3" id="labelfornamr">
                </div>

              </div>
              <div class="col-md-8">
                <div class="input-group mb-3">
                  <label for="labelforname" class="form-label">Enter Email name</label>
                  <input type="text" class="form-control" placeholder="Recipient’s username"
                    aria-label="Recipient’s username" aria-describedby="basic-addon2">
                  <span class="input-group-text" id="basic-addon2">@example.com</span>
                </div>
              </div>
              <button type="button" class="btn btn-success">Submit</button>
            </form>
